name: simulate

# Runs the full grid on fresh Yahoo data and commits data/ + results/ back to the repo.
# The sample window is fixed (2000-01-01 .. 2026-10-31) so results are reproducible;
# override it from the "Run workflow" button.
# GitHub-hosted runners have open internet; commits made with GITHUB_TOKEN do not
# re-trigger this workflow, so there is no loop.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "sample start (YYYY-MM-DD)"
        required: false
        default: "2000-01-01"
      end:
        description: "sample end (YYYY-MM-DD)"
        required: false
        default: "2026-10-31"
  push:
    branches: [main]
    paths: ["src/**", "tests/**", ".github/workflows/run.yml", "pyproject.toml"]

permissions:
  contents: write

concurrency:
  group: simulate
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests (look-ahead, alignment, placebo, accounting)
        run: pytest -q
      - name: Fetch prices
        run: buyadip fetch
      - name: Simulate
        run: buyadip run --start "${{ github.event.inputs.start || '2000-01-01' }}" --end "${{ github.event.inputs.end || '2026-10-31' }}"
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data results
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "results: $(date -u +%F) run [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results
